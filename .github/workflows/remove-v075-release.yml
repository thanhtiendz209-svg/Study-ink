name: Remove superseded Study Ink v0.7.5 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-v075-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-old-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify new v0.7.6 Windows and Android assets before removal
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.7.6-beta.2 --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' > /tmp/new-assets.txt
          grep -Fx 'app-arm64-v8a-release.apk' /tmp/new-assets.txt
          grep -Fx 'Study-Ink-v0.7.6-Windows10-x64.zip' /tmp/new-assets.txt
          echo "Newer release exists with both requested platforms."

      - name: Remove v0.7.5-beta.1 release and old tag
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.7.5-beta.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v0.7.5-beta.1 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            echo "Removed old v0.7.5-beta.1 release and tag."
          else
            echo "Old release already absent."
          fi

      - name: Verify only the new preview release remains
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.7.6-beta.2 --repo "$GITHUB_REPOSITORY" >/dev/null
          if gh release view v0.7.5-beta.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Old release still exists" >&2
            exit 1
          fi
          echo "Confirmed v0.7.6 remains; v0.7.5 removed."
