name: Build and publish Study Ink preview

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'Source ZIP at repository root'
        required: true
        default: 'Study_Ink_v0.6_Windows10_Android_Source.zip'
        type: string
      release_tag:
        description: 'Unique preview tag'
        required: true
        default: 'v0.6.0-beta.1'
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      SOURCE_ZIP: ${{ inputs.source_zip }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile
          filename = pathlib.Path(os.environ['SOURCE_ZIP'])
          if filename.name != str(filename) or not filename.is_file():
              raise SystemExit(f'Missing ZIP at repository root: {filename}')
          with zipfile.ZipFile(filename) as z:
              for member in z.infolist():
                  target = pathlib.PurePosixPath(member.filename)
                  if target.is_absolute() or '..' in target.parts:
                      raise SystemExit(f'Unsafe ZIP path: {member.filename}')
              z.extractall('.')
          if not pathlib.Path('pubspec.yaml').is_file():
              raise SystemExit('ZIP must contain pubspec.yaml at archive root')
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --project-name study_ink --platforms=android .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Study-Ink-Android-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: study-ink-android
          path: dist/Study-Ink-Android-preview.apk
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    env:
      SOURCE_ZIP: ${{ inputs.source_zip }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        shell: pwsh
        run: |
          $zip = $env:SOURCE_ZIP
          if ($zip -ne [System.IO.Path]::GetFileName($zip) -or !(Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Missing ZIP at repository root: $zip" }
          Expand-Archive -LiteralPath $zip -DestinationPath . -Force
          if (!(Test-Path pubspec.yaml)) { throw 'ZIP must contain pubspec.yaml at archive root' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --project-name study_ink --platforms=windows .
      - run: flutter pub get
      - run: dart run pdfx:install_windows
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Pack Windows portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $release = 'build/windows/x64/runner/Release'
          if (!(Test-Path $release)) { throw 'Windows build output missing' }
          Compress-Archive -Path "$release/*" -DestinationPath 'dist/Study-Ink-Windows10-x64.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: study-ink-windows10
          path: dist/Study-Ink-Windows10-x64.zip
          if-no-files-found: error

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: study-ink-*
          path: dist
          merge-multiple: true
      - name: Publish prerelease if both builds succeed
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(beta|rc)\.[0-9]+$ ]] || { echo 'Invalid preview tag'; exit 1; }
          test -s dist/Study-Ink-Android-preview.apk
          test -s dist/Study-Ink-Windows10-x64.zip
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"; exit 1
          fi
          gh release create "$RELEASE_TAG" dist/Study-Ink-Android-preview.apk dist/Study-Ink-Windows10-x64.zip \
            --target "$GITHUB_SHA" \
            --title "Study Ink $RELEASE_TAG — Windows 10 & Android" \
            --notes "Experimental builds. Windows: extract the full ZIP before opening the EXE. Android: install APK. Back up your notes before testing." \
            --prerelease --latest=false
